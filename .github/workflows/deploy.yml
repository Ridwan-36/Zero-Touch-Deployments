
name: Zero-Touch Deployment Pipeline

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Docker image tag"
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deployment-check:
    name: Deployment Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Confirm AWS deployment remains disabled
        run: |
          echo "AWS deployment is intentionally disabled."
          echo "Cost verification and OIDC setup are pending."
          echo "No AWS resources will be created by this workflow."

      - name: Validate deployment configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Requested environment: ${{ inputs.environment }}"
            echo "Requested image tag: ${{ inputs.image_tag }}"
          else
            echo "Requested environment: staging"
            echo "Commit: $GITHUB_SHA"
          fi

          echo "Configuration check completed."

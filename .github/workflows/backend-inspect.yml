name: Backend Inspect
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1
      - name: Inspect backend
        run: |
          aws s3api list-object-versions --bucket zero-touch-deployments-tfstate-301949382920
          aws dynamodb describe-table --table-name zero-touch-deployments-terraform-locks

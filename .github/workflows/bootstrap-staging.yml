name: Bootstrap Staging AWS Resources

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create Staging Backend and ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1
          role-session-name: StagingBootstrap

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Create Terraform state bucket and lock table
        run: |
          terraform -chdir=terraform/state-bootstrap init -backend=false -input=false
          terraform -chdir=terraform/state-bootstrap apply -auto-approve -input=false

      - name: Preserve bootstrap state for cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-state-bootstrap-tfstate
          path: terraform/state-bootstrap/terraform.tfstate
          if-no-files-found: warn
          retention-days: 7

      - name: Configure remote backend
        run: |
          cat > /tmp/registry-backend.hcl <<'BACKEND'
          bucket         = "zero-touch-deployments-tfstate-301949382920"
          key            = "zero-touch-deployments/registry-bootstrap.tfstate"
          region         = "ap-south-1"
          encrypt        = true
          dynamodb_table = "zero-touch-deployments-terraform-locks"
          use_lockfile   = true
          BACKEND

      - name: Create staging ECR repository
        run: |
          terraform -chdir=terraform/registry-bootstrap init -input=false -backend-config=/tmp/registry-backend.hcl
          terraform -chdir=terraform/registry-bootstrap workspace select staging || terraform -chdir=terraform/registry-bootstrap workspace new staging
          terraform -chdir=terraform/registry-bootstrap apply -auto-approve -input=false
          terraform -chdir=terraform/registry-bootstrap output

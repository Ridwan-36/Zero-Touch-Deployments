name: Root Staging Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1

      - name: Ensure ECS service-linked role exists
        run: |
          set +e
          output=$(aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "$output"
          elif echo "$output" | grep -qi "has been taken\|already exists"; then
            echo "ECS service-linked role already exists."
          else
            echo "$output"
            exit "$status"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Terraform Plan Only
        run: |
          set -euo pipefail
          cd terraform

          terraform init \
            -backend-config="bucket=zero-touch-deployments-tfstate-301949382920" \
            -backend-config="key=zero-touch-deployments/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=zero-touch-deployments-terraform-locks" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

          terraform workspace select staging || terraform workspace new staging

          terraform fmt -check -recursive
          terraform validate

          terraform plan \
            -var-file=environments/staging/terraform.tfvars.example \
            -out=staging.tfplan

          terraform show -no-color staging.tfplan | tee plan.txt

          grep -Fq "Plan: 5 to add, 0 to change, 2 to destroy." plan.txt || {
            echo "Plan differs from approved plan. Apply stopped."
            exit 1
          }

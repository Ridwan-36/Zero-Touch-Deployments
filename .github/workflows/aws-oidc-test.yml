name: AWS OIDC Authentication Test

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-authentication:
    name: Verify AWS OIDC Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2));

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1
          role-session-name: GitHubActionsOIDCTest

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Inspect Terraform State Bucket Versioning
        run: |
          echo "========== S3 STATE BUCKET VERSIONING =========="
          STATUS=$(aws s3api get-bucket-versioning \
            --bucket zero-touch-deployments-tfstate-301949382920 \
            --region ap-south-1 \
            --query 'Status' --output text)

          if [ "$STATUS" = "Enabled" ]; then
            echo "VERSIONING STATUS: Enabled"
          elif [ "$STATUS" = "Suspended" ]; then
            echo "VERSIONING STATUS: Suspended"
          else
            echo "VERSIONING STATUS: Not enabled"
          fi

      - name: Inspect existing project ECR repositories
        run: |
          echo "========== PROJECT ECR REPOSITORIES =========="
          aws ecr describe-repositories \
            --region ap-south-1 \
            --query "repositories[?starts_with(repositoryName, 'zero-touch-deployments-')].[repositoryName,repositoryUri]" \
            --output table

      - name: Verify Staging ECS Service
        run: |
          aws ecs describe-services \
            --cluster zero-touch-deployments-staging-cluster \
            --services zero-touch-deployments-staging-service \
            --region ap-south-1 \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}' \
            --output table

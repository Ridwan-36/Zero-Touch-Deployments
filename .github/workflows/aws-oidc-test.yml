name: AWS OIDC Authentication Test

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-authentication:
    name: Verify AWS OIDC Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2));

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1
          role-session-name: GitHubActionsOIDCTest

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify Staging ECS Service
        run: |
          aws ecs describe-services \
            --cluster zero-touch-deployments-staging-cluster \
            --services zero-touch-deployments-staging-service \
            --region ap-south-1 \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}' \
            --output table

      - name: Verify Staging Application HTTP Health
        shell: bash
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ap-south-1 \
            --query "LoadBalancers[?contains(LoadBalancerName, 'zero-touch-deployments-staging')].DNSName | [0]" \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "Staging ALB not found"
            exit 1
          fi

          echo "Application URL: http://$ALB_DNS"

          for attempt in {1..12}; do
            if curl -fsS "http://$ALB_DNS/" -o /tmp/app-response.html; then
              echo "HTTP health check: SUCCESS"
              head -c 300 /tmp/app-response.html
              exit 0
            fi
            sleep 10
          done

          echo "HTTP health check failed"
          exit 1

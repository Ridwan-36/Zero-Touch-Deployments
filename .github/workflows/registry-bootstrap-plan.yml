name: Registry Bootstrap - Plan Only

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-registry-bootstrap
  cancel-in-progress: false

jobs:
  registry-plan:
    name: Plan Staging ECR Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::301949382920:role/GitHubActions-Staging-ZeroTouchDeployments
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Initialize Remote Backend
        run: |
          terraform -chdir=terraform/registry-bootstrap init \
            -input=false \
            -backend-config="bucket=zero-touch-deployments-tfstate-301949382920" \
            -backend-config="key=zero-touch-deployments/registry-bootstrap.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=zero-touch-deployments-terraform-locks" \
            -backend-config="use_lockfile=true"

      - name: Select Staging Workspace
        run: |
          cd terraform/registry-bootstrap
          terraform workspace select staging || terraform workspace new staging
          terraform workspace show

      - name: Terraform Format Check
        run: terraform -chdir=terraform/registry-bootstrap fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=terraform/registry-bootstrap validate

      - name: Generate Terraform Plan Only
        run: |
          cd terraform/registry-bootstrap
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=registry.tfplan

          terraform show -no-color registry.tfplan | tee registry-plan.txt

      - name: Upload Registry Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-registry-terraform-plan
          path: |
            terraform/registry-bootstrap/registry.tfplan
            terraform/registry-bootstrap/registry-plan.txt
          retention-days: 3
          if-no-files-found: error
